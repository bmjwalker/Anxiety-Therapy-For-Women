            - paragraph [ref=e411]: 20+ years supporting women through burnout, identity shifts, and life transitions with a direct, compassionate approach.
        - generic [ref=e412]:
          - heading "Jennifer Walker, LCSW" [level=2] [ref=e413]
          - heading "My Journey" [level=3] [ref=e415]
          - generic [ref=e416]:
            - paragraph [ref=e417]:
              - text: "Finding the right therapist is important yet can feel intimidating. I remember my first time picking a therapist — I was like:"
              - emphasis [ref=e418]: "\"Where do I even start? Will they understand me? What if it’s awkward? What if I don’t like them?\""
              - text: The process can feel overwhelming, especially when you’re already navigating challenges that brought you to therapy in the first place. It’s a vulnerable step, and it takes courage to explore this path.
            - paragraph [ref=e419]: As a biracial woman, I’ve navigated the intricate paths of personal identity and growth, shaped by experiences of belonging to multiple worlds. This perspective gives me a unique lens to support women in interracial relationships and those who have grown up as the minority in their community. While these experiences inform my work, my focus is on connecting with women of all backgrounds, particularly high-performing professional women navigating the complexities of life transitions, anxiety, identity, and self-worth.
            - paragraph [ref=e420]: With over 20 years of diverse experience across K–12 and higher education, community mental health, private practice, non-profits, and corporate wellness, I bring a broad understanding of the unique challenges women face in different environments. My approach is tailored to support women grappling with toxic work or relationship dynamics, striving to find balance, and seeking to reclaim their confidence and sense of self.
            - paragraph [ref=e421]: I’m committed to creating a safe, confidential, non-judgmental space where women can feel seen and heard.
            - paragraph [ref=e422]: As a successful woman, it’s often hard to be vulnerable, but I am here to support you. I welcome honesty, humor, and direct communication while maintaining a compassionate atmosphere. My goal is to empower women to reach their full potential and navigate life’s transitions with confidence.
            - paragraph [ref=e423]: Women working with me often appreciate not only the progress made during our sessions but also the practical tools they gain to continue their self-discovery and growth between sessions.
            - paragraph [ref=e424]: If you’re ready to explore this journey together, I invite you to schedule a free 15-minute consultation to see if we’re a good fit.
          - blockquote [ref=e425]: “Compassionate curiosity is the path to change.”
          - link "Schedule a Free Consultation" [ref=e426] [cursor=pointer]:
            - /url: https://jennifer-walker7285.clientsecure.me/sign-in
