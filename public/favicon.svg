<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="JW monogram">
  <!-- Simplified for small sizes: thicker strokes, larger bar, tighter margins -->
  <g fill="none" stroke="#57686B" stroke-width="16" stroke-linecap="square">
    <line x1="16" y1="16" x2="184" y2="16" />
    <line x1="16" y1="16" x2="16" y2="184" />
    <line x1="184" y1="16" x2="184" y2="184" />
  </g>

  <!-- Bottom accent bar, centered on the square's bottom edge -->
  <rect x="16" y="173" width="168" height="22" fill="#CAAF99" />

  <!-- JW monogram -->
  <text
    x="100"
    y="104"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="96"
    letter-spacing="-4"
    fill="#57686B"
  >JW</text>
</svg>
