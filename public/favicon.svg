<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="JW monogram">
  <!-- Simplified for small sizes: thicker strokes, larger radius -->
  <!-- Ring: 270° teal arc (top, left, right) -->
  <path
    d="M 40.6 159.4 A 84 84 0 1 1 159.4 159.4"
    fill="none"
    stroke="#57686B"
    stroke-width="16"
    stroke-linecap="butt"
  />

  <!-- Ring: 90° rose accent arc, centered at the bottom -->
  <path
    d="M 159.4 159.4 A 84 84 0 0 1 40.6 159.4"
    fill="none"
    stroke="#CAAF99"
    stroke-width="16"
    stroke-linecap="butt"
  />

  <!-- JW monogram -->
  <text
    x="100"
    y="104"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="96"
    letter-spacing="-4"
    fill="#57686B"
  >JW</text>
</svg>
