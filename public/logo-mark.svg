<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="JW monogram">
  <!-- Ring: 270° teal arc (top, left, right) -->
  <path
    d="M 46.26 153.74 A 76 76 0 1 1 153.74 153.74"
    fill="none"
    stroke="#57686B"
    stroke-width="8"
    stroke-linecap="butt"
  />

  <!-- Ring: 90° rose accent arc, centered at the bottom -->
  <path
    d="M 153.74 153.74 A 76 76 0 0 1 46.26 153.74"
    fill="none"
    stroke="#CAAF99"
    stroke-width="8"
    stroke-linecap="butt"
  />

  <!-- JW monogram -->
  <text
    x="100"
    y="103"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="84"
    letter-spacing="-2"
    fill="#57686B"
  >JW</text>
</svg>
